 testing:                                                   # Our running test cases
  runs-on: ubuntu-latest                                    # GitHub VM
  container: ubuntu:26.04                                   # With target environment image
  steps:
   - uses: actions/checkout@v4                                         # Move code
   - run: printf 'awesome sauce\n' > fixedtest.txt                     # We are not going to depend on curl in testing -> Placeholder name for testing
   - run: bash mkuser.sh fixedtest.txt && id awesome.sauce             # Test line for mkuser.sh, run script + ensure desired user exists
   - run: printf 'Y\n' | bash add_user.sh craig flatt; id craig.flatt  # Test line for add_user.sh, run + check for expected user
